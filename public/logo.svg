<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- 1. Books Icon -->
  <g transform="translate(10, 16)">
    <!-- Top Blue Book -->
    <path
      d="M68 6H16C10.477 6 6 10.477 6 16C6 21.523 10.477 26 16 26H68"
      stroke="#0056B3"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line x1="18" y1="12.5" x2="62" y2="12.5" stroke="#0056B3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="19.5" x2="62" y2="19.5" stroke="#0056B3" stroke-width="2.5" stroke-linecap="round"/>

