    <text x="0" y="14" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="1">STATIONERY</text>
    <text x="0" y="28" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="1">PRINTING</text>
