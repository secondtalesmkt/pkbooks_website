    <line x1="18" y1="38.5" x2="62" y2="38.5" stroke="#ED1C24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="45.5" x2="62" y2="45.5" stroke="#ED1C24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 2. PK (Blue) -->
  <text x="96" y="60" fill="#0056B3" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">PK</text>

  <!-- 3. Books (Red) -->
  <text x="174" y="60" fill="#ED1C24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-0.5">Books</text>

  <!-- 4. Stacked Tagline -->
